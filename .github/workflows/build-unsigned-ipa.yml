name: Build Unsigned IPA

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned Release build
        run: |
          xcodebuild archive \
            -project TinyPress.xcodeproj \
            -scheme TinyPress \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TinyPress.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa_root/Payload"
          cp -R "$RUNNER_TEMP/TinyPress.xcarchive/Products/Applications/TinyPress.app" "$RUNNER_TEMP/ipa_root/Payload/"
          cd "$RUNNER_TEMP/ipa_root"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/TinyPress-unsigned.ipa"

      - name: Upload TinyPress-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyPress-unsigned-ipa
          path: TinyPress-unsigned.ipa
          retention-days: 14
